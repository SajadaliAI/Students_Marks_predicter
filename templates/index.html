<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Marks Predictor</title>
  <style>
    body {
      background: linear-gradient(to right, #4facfe, #00f2fe);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .container {
      background-color: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    h2 {
      margin-bottom: 20px;
      color: #333;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
      color: #444;
    }

    input[type="number"] {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      margin-top: 5px;
    }

    button {
      margin-top: 25px;
      padding: 12px 20px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      width: 100%;
      transition: background 0.3s ease;
    }

    button:hover {
      background-color: #0056b3;
    }

    .result {
      margin-top: 20px;
      font-size: 18px;
      color: green;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="developer">✨ Developed by <span class="name">Sajad Ali</span> 🚀</div>

    <!-- <div class="developer">Developed by Sajad Ali</div> -->
    <h2>🎓 Student Marks Predictor</h2>
    <form action="{{url_for('predict')}}"method="post">
    <!-- <form action="/predict" method="post"> -->
      <label for="hours">Study Hours:</label>
      <input type="number" step="0.1" name="hours" id="hours" placeholder="Enter hours studied" required>
      <button type="submit">Predict Marks</button>
    </form>

    {% if prediction %}
    <div class="result">
      📊 Predicted Marks: {{ prediction }}%
    </div>
    {% endif %}
  </div>
</body>
</html>
